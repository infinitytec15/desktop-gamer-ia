[package]
name = "gf-core"
version = "0.6.0"
edition = "2021"
[build-dependencies]
serde_json = "1"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

rusqlite = { version = "0.37", features = ["bundled"] }
sysinfo = "0.37"
ts-rs = { version = "11", features = ["serde-compat"] }

reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
tungstenite = "0.28"
sha2 = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
uuid = { version = "1", features = ["v4"] }
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation", "Win32_System_Registry", "Win32_Security", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }
