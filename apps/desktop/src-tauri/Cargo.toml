[package]
name = "gameforge"
version = "0.6.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
gf-core = { path = "../../../crates/gf-core" }

[features]
custom-protocol = ["tauri/custom-protocol"]
